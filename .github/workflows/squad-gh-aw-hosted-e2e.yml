name: Squad gh-aw hosted E2E

# This controller is intentionally available only through repository_dispatch,
# which GitHub loads from the default branch. The squad-gh-aw-e2e environment
# must additionally restrict deployment branches to the protected `dev` branch.
# Configure these environment variables:
# - SQUAD_GH_AW_E2E_TARGET_REPOSITORY (canonical owner/name)
# - SQUAD_GH_AW_E2E_TARGET_REPOSITORY_ID (numeric repository ID)
# - SQUAD_GH_AW_E2E_TARGET_OWNER_ID (numeric owner ID)
# - SQUAD_GH_AW_E2E_PAT_ACTOR_LOGIN and SQUAD_GH_AW_E2E_PAT_ACTOR_ID
# The SQUAD_GH_AW_E2E_TOKEN secret is scoped only to that one public consumer.
#
# Two event types share this controller:
# - squad-gh-aw-hosted-e2e: installs the package, triggers bootstrap, and either validates the
#   Cast PR review canary directly or (the only reachable outcome against the published setup
#   guidance) reports a non-terminal `awaiting_manual_pr` status once bootstrap opens the manual
#   pull request fallback issue. It never creates that Cast PR itself.
# - squad-gh-aw-hosted-e2e-resume: dispatched later, after a human may have opened the Cast PR the
#   fallback issue asked for. It only observes (read-only) whether that PR exists, matches the
#   fallback issue's provenance, and was authorized by the base-controlled Squad Review canary --
#   requires client_payload.evidence_run_id naming the prior hosted-e2e run to resume from.
on:
  repository_dispatch:
    types: [squad-gh-aw-hosted-e2e, squad-gh-aw-hosted-e2e-resume]

permissions:
  contents: read

concurrency:
  group: squad-gh-aw-hosted-e2e
  cancel-in-progress: false

jobs:
  hosted-e2e:
    name: Install, merge, bootstrap, and probe
    if: >-
      github.repository == 'bradygaster/squad'
      && github.ref_name == github.event.repository.default_branch
      && github.event.action == 'squad-gh-aw-hosted-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: squad-gh-aw-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          cache: npm

      - name: Install trusted controller dependencies
        run: |
          npm config set registry "https://packagefeedproxy.microsoft.io/npm/"
          npm ci --ignore-scripts

      - name: Install pinned gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install --force --pin v0.89.22 github/gh-aw
          test "$(gh aw --version 2>&1 | awk '{print $NF}')" = v0.89.22

      - name: Verify trusted default-branch controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run gh-aw:integrity:check
          node scripts/gh-aw-hosted-e2e.mjs source-preflight \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-repository-id "$GITHUB_REPOSITORY_ID" \
            --source-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run trusted hosted journey
        env:
          GH_TOKEN: ${{ secrets.SQUAD_GH_AW_E2E_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.SQUAD_GH_AW_E2E_TARGET_REPOSITORY }}
          TARGET_REPOSITORY_ID: ${{ vars.SQUAD_GH_AW_E2E_TARGET_REPOSITORY_ID }}
          TARGET_OWNER_ID: ${{ vars.SQUAD_GH_AW_E2E_TARGET_OWNER_ID }}
          PAT_ACTOR_LOGIN: ${{ vars.SQUAD_GH_AW_E2E_PAT_ACTOR_LOGIN }}
          PAT_ACTOR_ID: ${{ vars.SQUAD_GH_AW_E2E_PAT_ACTOR_ID }}
          SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/gh-aw-hosted-e2e.mjs hosted \
            --target "$TARGET_REPOSITORY" \
            --target-repository-id "$TARGET_REPOSITORY_ID" \
            --target-owner-id "$TARGET_OWNER_ID" \
            --pat-actor-login "$PAT_ACTOR_LOGIN" \
            --pat-actor-id "$PAT_ACTOR_ID" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-repository-id "$GITHUB_REPOSITORY_ID" \
            --source-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/squad-gh-aw-hosted-e2e"

      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: squad-gh-aw-hosted-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/squad-gh-aw-hosted-e2e/
          if-no-files-found: error
          retention-days: 30

  resume-fallback:
    name: Observe the manually created Cast fallback pull request
    # Dispatched after a human has (or may have) opened the Cast pull request a prior
    # `hosted-e2e` run's fallback issue asked for. This job only *observes* that pull request and
    # the base-controlled Squad Review canary through read-only API calls -- it never creates,
    # approves, or otherwise mutates the pull request itself; doing so with any token would
    # substitute automation for the human-in-the-loop step `can_approve_pull_request_reviews=false`
    # exists to require. client_payload.evidence_run_id must name the prior `hosted-e2e` run whose
    # uploaded evidence artifact (containing preflight.json and installation-identity.json) this
    # run resumes from.
    #
    # Token scoping (documented separately from hosted-e2e below):
    # - `github.token` (job-level `actions: read`, otherwise default `contents: read`): used only
    #   to download this *same* repository's own prior-run evidence artifact via `gh run
    #   download`. It cannot reach the external target fixture repository at all.
    # - `secrets.SQUAD_GH_AW_E2E_TOKEN`: the only credential able to read the external target
    #   repository's pull requests/reviews/issues/branches. No separate read-only PAT exists for
    #   that repository, so this job necessarily reuses the same secret `hosted-e2e` uses for
    #   writes elsewhere -- but `resumeFallback()` and everything it transitively calls
    #   (`bootstrapOutputs`, `selectManualFallbackCastPr`, `waitForManualFallbackCastPr`,
    #   `waitForBaseControlledReviewCanary`) issue only `gh api` GET calls against that target, a
    #   code-level invariant proved by a dedicated transitive-call-graph test in
    #   test/gh-aw-hosted-e2e.test.ts (`transitively proves every function resumeFallback can
    #   reach issues read-only GitHub API calls`). The credential's authority is broader than this
    #   job exercises; it never performs a `pr create`/`pr merge`/`pr review`/write `--method`
    #   call.
    if: >-
      github.repository == 'bradygaster/squad'
      && github.ref_name == github.event.repository.default_branch
      && github.event.action == 'squad-gh-aw-hosted-e2e-resume'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: squad-gh-aw-e2e
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: 22
          cache: npm

      - name: Install trusted controller dependencies
        run: |
          npm config set registry "https://packagefeedproxy.microsoft.io/npm/"
          npm ci --ignore-scripts

      - name: Download prior hosted-e2e evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ github.event.client_payload.evidence_run_id }}
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_RUN_ID"
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "squad-gh-aw-hosted-e2e-$EVIDENCE_RUN_ID" \
            --dir "$RUNNER_TEMP/squad-gh-aw-hosted-e2e-evidence-in"

      - name: Observe the manually created Cast fallback pull request
        env:
          GH_TOKEN: ${{ secrets.SQUAD_GH_AW_E2E_TOKEN }}
          TARGET_REPOSITORY: ${{ vars.SQUAD_GH_AW_E2E_TARGET_REPOSITORY }}
        run: |
          set -euo pipefail
          node scripts/gh-aw-hosted-e2e.mjs resume-fallback \
            --target "$TARGET_REPOSITORY" \
            --evidence-in "$RUNNER_TEMP/squad-gh-aw-hosted-e2e-evidence-in" \
            --evidence "$RUNNER_TEMP/squad-gh-aw-hosted-e2e-resume"

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: squad-gh-aw-hosted-e2e-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/squad-gh-aw-hosted-e2e-resume/
          if-no-files-found: error
          retention-days: 30
